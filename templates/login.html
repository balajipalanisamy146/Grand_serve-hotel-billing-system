<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart POS | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('{{ url_for("static", filename="images/bglogin.webp") }}') no-repeat center center fixed;
            background-size: cover;
            /*background: linear-gradient(135deg, #FF9800 0%, #F44336 100%);*/
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 3rem;
        }
    </style>
</head>

<body>
    <div class="glass-card login-card text-center fade-in">
        <div class="mb-4">
            <div class="bg-primary bg-opacity-10 d-inline-flex p-3 rounded-circle mb-3">
                <i class="fas fa-hotel fa-2x text-primary"></i>
            </div>
            <h3 class="fw-bold text-white" id="authTitle">Welcome Back</h3>
            <p class="text-white small" id="authSub">Enter credentials to access POS</p>
        </div>

        <form id="loginForm">
            <div class="mb-3 text-start">
                <label class="form-label text-white small fw-bold">Username</label>
                <input type="text" class="form-control rounded-pill px-4 py-2" id="username" required>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label text-white small fw-bold">Password</label>
                <input type="password" class="form-control rounded-pill px-4 py-2" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm mb-3" id="authBtn">
                Login to System
            </button>
        </form>

        <p class="mb-0 small text-white" id="toggleText">
            Don't have an account? <a href="#" id="toggleAuth" class="text-primary fw-bold text-decoration-none">Register here</a>
        </p>

        <div class="mt-4 text-white small">
            &copy; 2026 Smart Hotel Solutions
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const toggleAuth = document.getElementById('toggleAuth');
        const toggleText = document.getElementById('toggleText');
        const cardTitle = document.getElementById('authTitle');
        const cardSub = document.getElementById('authSub');
        const submitBtn = document.getElementById('authBtn');

        let isLogin = true;

        toggleAuth.onclick = (e) => {
            e.preventDefault();
            isLogin = !isLogin;
            if (isLogin) {
                cardTitle.textContent = "Welcome Back";
                cardSub.textContent = "Enter credentials to access POS";
                submitBtn.textContent = "Login to System";
                toggleText.innerHTML = `Don't have an account? <a href="#" id="toggleAuth" class="text-primary fw-bold text-decoration-none">Register here</a>`;
                document.getElementById('username').value = 'admin';
                document.getElementById('password').value = 'admin123';
            } else {
                cardTitle.textContent = "Create Account";
                cardSub.textContent = "Register to start your own POS system";
                submitBtn.textContent = "Register Account";
                toggleText.innerHTML = `Already have an account? <a href="#" id="toggleAuth" class="text-primary fw-bold text-decoration-none">Login here</a>`;
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
            }
            // Re-bind the click event
            document.getElementById('toggleAuth').onclick = toggleAuth.onclick;
        };

        loginForm.onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const endpoint = isLogin ? '/api/auth/login' : '/api/auth/register';

            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();

            if (res.ok) {
                Swal.fire({
                    icon: 'success',
                    title: 'Success',
                    text: isLogin ? 'Login successful!' : 'Account created successfully!',
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = '/dashboard';
                });
            } else {
                Swal.fire('Error', data.message || 'Authentication failed', 'error');
            }
        };
    </script>
</body>

</html>
