<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrandServe AI | Command Portal</title>
    <!-- Premium Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap"
        rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Animations -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo - Copy.png') }}">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root {

            --accent: #f97316;
            --dark: #0f172a;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: #000;
            overflow: hidden;
            height: 100%;
        }

        /* ── Full Screen Immersive Background (FULL OPACITY) ── */
        .hero-master {
            height: 100vh;
            width: 100%;
            /* No overlay, full opacity image */
            background: url('{{ url_for("static", filename="images/bghome.png") }}') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* ── Navigation ── */
        .navbar {
            padding: 2.5rem 0;
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 3.8rem;
            color: #08e80f !important;
            letter-spacing: -3px;
            text-shadow:
                4px 4px 0px #054a04,
                8px 8px 20px rgba(199, 237, 199, 0.5),
                0 0 30px rgba(8, 232, 15, 0.3);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block;
            text-decoration: none;
        }

        .navbar-brand span {
            color: var(--accent);
            text-shadow:
                4px 4px 0px #8a3d0b,
                8px 8px 20px rgba(242, 186, 186, 0.5),
                0 0 35px rgba(249, 115, 22, 0.4);
        }



        /* ── Centered Content (NO BACKGROUND COLOR) ────────── */
        .hero-content {
            background: transparent;
            /* No background color */
            border: none;
            /* No border */
            backdrop-filter: none;
            /* No blur */
            text-align: center;
            max-width: 1000px;
            width: 90%;
            z-index: 10;
        }

        .hero-tag {
            font-family: 'Playfair Display', serif;
            color: var(--accent);
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            display: block;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 7rem;
            font-weight: 100;
            line-height: 1;
            color: #12c905;
            /* High contrast matching color */
            margin-bottom: 2.5rem;
            /* Strong Shadow for readability on full-opacity image */
            text-shadow: 0 5px 30px rgba(8, 235, 34, 0.356), 0 2px 5px rgb(236, 6, 113);
        }

        .hero-title i {
            font-style: italic;
            font-weight: 400;
            color: rgba(238, 5, 110, 0.768);
            text-shadow: 0 2px 2px rgb(7, 228, 11), 0 10px 30px rgba(217, 6, 6, 0.352);
        }

        .hero-desc {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: rgb(7, 50, 3);
            max-width: 800px;
            margin: 0 auto 4rem auto;
            line-height: 1.8;
            font-weight: 500;
        }

        /* ── Action Buttons ────────────────────────────────── */
        .cta-group {
            display: flex;
            gap: 30px;
            justify-content: center;
        }

        .btn-gs {
            font-family: Arial, Helvetica, sans-serif;
            padding: 1.4rem 1.5rem;
            border-radius: 100px;
            font-weight: 900;
            font-size: 1rem;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            letter-spacing: 2px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .btn-gs-primary {
            background: #168004;
            color: #ffffff;
        }

        .btn-gs-primary:hover {
            background: #11ff00;
            color: #000000;
            transform: translateY(-12px) scale(1.05);
            box-shadow: 0 25px 50px #08870380;
        }

        .btn-gs-outline {
            color: #fff;
            background: var(--accent);
            backdrop-filter: blur(5px);
        }

        .btn-gs-outline:hover {
            background: #f4007e;
            color: #ffffff;
            transform: translateY(-12px);
            box-shadow: 0 25px 50px #b9039b57;
        }

        /* ── Floating Food Dish Circle ── */
        .food-circle-wrap {
            position: absolute;
            right: 7%;
            bottom: 8%;
            width: 280px;
            height: 280px;
            z-index: 20;
            animation: floatDish 4s ease-in-out infinite;
        }

        @keyframes floatDish {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-18px) rotate(2deg);
            }
        }

        .food-circle-outer {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: conic-gradient(from 0deg,
                    #f97316, #fbbf24, #ef4444, #f97316,
                    #fbbf24, #22c55e, #f97316);
            padding: 4px;
            box-shadow:
                0 0 40px rgba(249, 115, 22, 0.6),
                0 0 80px rgba(249, 115, 22, 0.3),
                0 20px 60px rgba(0, 0, 0, 0.4);
            animation: spinRing 8s linear infinite;
        }

        @keyframes spinRing {
            from {
                filter: hue-rotate(0deg);
            }

            to {
                filter: hue-rotate(360deg);
            }
        }

        .food-circle-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #fff8;
            background: #1a0a00;
        }

        .food-circle-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            transition: transform 0.5s ease;
        }

        .food-circle-wrap:hover .food-circle-inner img {
            transform: scale(1.08);
        }

        /* Decorative spice dots */
        .spice-dot {
            position: absolute;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            from {
                opacity: 0.4;
                transform: scale(1);
            }

            to {
                opacity: 1;
                transform: scale(1.4);
            }
        }

        .spice-dot:nth-child(1) {
            width: 12px;
            height: 12px;
            background: #f97316;
            top: -10px;
            right: 60px;
            animation-delay: 0s;
        }

        .spice-dot:nth-child(2) {
            width: 8px;
            height: 8px;
            background: #fbbf24;
            top: 30px;
            right: -15px;
            animation-delay: 0.4s;
        }

        .spice-dot:nth-child(3) {
            width: 10px;
            height: 10px;
            background: #ef4444;
            bottom: 20px;
            right: -10px;
            animation-delay: 0.8s;
        }

        .spice-dot:nth-child(4) {
            width: 6px;
            height: 6px;
            background: #22c55e;
            bottom: -5px;
            right: 80px;
            animation-delay: 1.2s;
        }

        .spice-dot:nth-child(5) {
            width: 9px;
            height: 9px;
            background: #f97316;
            top: 60px;
            left: -12px;
            animation-delay: 0.6s;
        }

        /* Label badge */
        .food-badge {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #f97316, #ef4444);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 18px;
            border-radius: 100px;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(249, 115, 22, 0.5);
        }
    </style>
</head>

<body>

    <section class="hero-master">

        <!-- ── Navigation ── -->
        <nav class="navbar">
            <div class="container-fluid px-5 d-flex justify-content-center">
                <a class="navbar-brand d-flex align-items-center gap-3" href="/">
                    <img src="{{ url_for('static', filename='images/logo - Copy.png') }}" alt="GrandServe Logo"
                        style="height: 80px; filter: drop-shadow(0 4px 15px rgba(255, 234, 1, 0.49));">
                    Grand<span>Serve</span>
                </a>
            </div>
        </nav>

        <!-- ── Centered Content (No Background/Card) ── -->
        <div class="hero-content" data-aos="fade-up" data-aos-duration="1500">
            <span class="hero-tag">Secure Operations</span>
            <h1 class="hero-title">
                Pure taste, <br><i>quantum</i> speed.
            </h1>
            <p class="hero-desc">
                Premium restaurant technology built for seamless service and elegant restaurant dining experiences.
            </p>

            <div class="cta-group">
                <a href="/billing" class="btn-gs btn-gs-primary">
                    <i class="fas fa-file-invoice-dollar"></i> Launch Billing
                </a>
                <a href="/dashboard" class="btn-gs btn-gs-outline">
                    <i class="fas fa-chart-pie"></i> Admin Dashboard
                </a>
            </div>
        </div>

        <!-- ── Floating Food Dish Circle (Right Side) ── -->
        <div class="food-circle-wrap" data-aos="zoom-in" data-aos-duration="1200" data-aos-delay="400">
            <!-- Decorative spice dots -->
            <span class="spice-dot"></span>
            <span class="spice-dot"></span>
            <span class="spice-dot"></span>
            <span class="spice-dot"></span>
            <span class="spice-dot"></span>

            <div class="food-circle-outer">
                <div class="food-circle-inner">
                    <img src="{{ url_for('static', filename='images/seafood.jpeg') }}" alt="Signature Food Dish"
                        onerror="this.src='https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?w=600&q=90&fit=crop'">
                </div>
            </div>

            <div class="food-badge">🍛 Chef's Special</div>
        </div>

    </section>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });
    </script>
</body>

</html>
